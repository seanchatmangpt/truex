name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      # Same install path as ci.yml — must not ENOENT on cognition pkg.
      - run: pnpm install
      # Full-repo lint:fix is pre-broken (~2k unfixable errors). Keep install
      # green so autofix.ci stays a valid Gate1 path witness; skip autofix-ci
      # until lint debt is separately retired.
