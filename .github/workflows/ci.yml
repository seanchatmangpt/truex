name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      # Install must resolve packages/cognition → file:crates/truex-kernel-cognition/pkg
      - run: pnpm install
      # Gate1 Truex admit-court falsifier (ECOSYSTEM-SPEC-27.1.1). Full-repo
      # lint/types/build remain blocked by pre-existing debt unrelated to admit.
      - name: Gate1 admit-court
        run: pnpm exec vitest run test/admit/admit-court.test.ts
