[package]
name = "truex-kernel-types"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Binary data structures for truex-kernel process mining platform"
repository = "https://github.com/seanchatmangpt/truex-kernel"
documentation = "https://docs.rs/truex-kernel-types"
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hashbrown = { workspace = true }
smallvec = { workspace = true }
blake3 = { workspace = true }
rustc-hash = { workspace = true }
quick-xml = { version = "0.37", optional = true }
flate2 = { version = "1.0", optional = true }

[features]
import = ["quick-xml", "flate2"]

[dev-dependencies]
serde_json = { workspace = true }
